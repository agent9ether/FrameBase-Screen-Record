<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FrameBase Recording Controls</title><link rel="stylesheet" href="mini-control.css">
</head>
<body>
  <main class="control-strip">
    <div class="drag-handle" aria-hidden="true">⠿</div>
    <div class="brand"><span class="mark">▥</span><span>FRAMEBASE <i>STUDIO</i></span></div>
    <span class="separator"></span>
    <div class="recording-state"><span class="pulse"></span><span>RECORDING</span><strong id="clock">00:00</strong></div>
    <button class="control-button pause" id="pause" title="Pause recording">Ⅱ <small>Pause</small></button>
    <button class="control-button stop" id="stop" title="Stop and open editor"><span>■</span> Stop</button>
    <button class="control-button studio" id="studio" title="Open the full studio">↗ <small>Studio</small></button>
  </main>
  <script src="mini-control.js"></script>
</body>
</html>
