name: Feature request
description: Suggest an idea for FrameBase
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the video you're trying to make, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: who
    attributes:
      label: Is this for people, agents, or both?
      options: [People using the app, AI agents, Both]
