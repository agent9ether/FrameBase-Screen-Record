name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: input
    id: version
    attributes:
      label: FrameBase version
      description: Help › About FrameBase Studio (on macOS, FrameBase Studio › About). Say if you run it from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04
  - type: dropdown
    id: agent
    attributes:
      label: Was an AI agent driving FrameBase?
      options: ["No", "Yes (say which client below)"]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private first. Never paste your agent token.
